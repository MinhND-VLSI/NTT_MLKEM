# Tiny Tapeout project information
project:
  title:        "NTT Acceleration for ML-KEM"
  author:       "Nguyen Duc Minh"
  discord:      ""
  description:  "Hardware accelerator module for NTT MLKEM"
  language:     "Verilog"
  clock_hz:     50000000

  # Kích thước 2x2 để tránh lỗi tràn diện tích (Placement/Routing congestion)
  tiles: "2x2"

  # Top module chuẩn khớp với file project.v
  top_module:  "tt_um_ntt_top"

  # Danh sách toàn bộ các file Verilog nguồn
  source_files:
    - "project.v"
    - "ntt_top_dual.v"
    - "ntt_fsm_rom_dual.v"
    - "nmi_reorder_dual.v"
    - "dual_butterfly.v"
    - "mod_multiplier.v"
    - "mod_add_sub_div2.v"

# Pinout mapping chuẩn theo thiết kế
pinout:
  # Inputs
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Outputs
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins
  uio[0]: "data_in[8] / data_out[8]"
  uio[1]: "data_in[9] / data_out[9]"
  uio[2]: "data_in[10] / data_out[10]"
  uio[3]: "data_in[11] / data_out[11]"
  uio[4]: "start"
  uio[5]: "mode"
  uio[6]: "done"
  uio[7]: ""

# Do not change!
yaml_version: 6
